services:
  fawowa:
    build: .
    container_name: fawowa-material-table
    ports:
      - "3456:3456"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3456
    networks:
      - caddy-net

networks:
  caddy-net:
    external: true