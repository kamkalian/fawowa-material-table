<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materialdatenbank</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="app">
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div>
        <h1 class="glow-text">Materialdatenbank</h1>
        <p class="header-sub" id="mat-count">Lade Materialien...</p>
      </div>
      <div style="display:flex;align-items:center;gap:.5rem">
        <a class="btn btn-ghost btn-sm" id="btn-admin" href="/admin.html" style="display:none" title="Admin">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Admin
        </a>
        <button class="btn btn-ghost btn-icon" id="btn-theme" title="Hell/Dunkel umschalten">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="icon-sun"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="icon-moon" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="btn btn-primary" id="btn-request">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          Material anfragen
        </button>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main class="container" style="padding-top:1.5rem;padding-bottom:1.5rem">

    <!-- Request form modal (hidden by default) -->
    <div class="modal-overlay" id="request-modal" style="display:none">
      <div class="modal" id="request-form-container"></div>
    </div>

    <!-- Search bar + filter button -->
    <div class="search-toolbar">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="input search-input" id="global-search" placeholder="Suchen... (Enter für Tag)">
      <button class="btn btn-outline search-filter-btn" id="btn-add-filter" title="Eigenschaftsfilter">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Filter
      </button>
    </div>

    <!-- Tags row (search tags + property filter tags) -->
    <div class="tags-row" id="tags-row"></div>

    <!-- Property filter rows (hidden, rendered dynamically) -->
    <div id="prop-filters"></div>

    <!-- Results info -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
      <p style="font-size:.75rem;color:var(--fg-muted)" id="results-info"></p>
    </div>

    <!-- Table -->
    <div class="table-wrap" id="table-container"></div>

    <!-- Pagination -->
    <div id="pagination"></div>
  </main>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
